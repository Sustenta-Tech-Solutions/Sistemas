<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style_cadastro.css">
</head>
<body>
    <div class="navbar">

    </div>
    <div class="tela-cadastro"> <!-- Espaço central entre navbar e footer-->
        <div class="card-cadastro"> <!-- Card de cadastro -->
            <div class="superior">
                <a href="#" class="voltar">
                    <img src="imagens/icone_voltar.svg" width="50"  height="50" alt="">
                </a>
                <img src="imagens/logo_circular_sustentatech.svg" alt="">
            </div>
            <p>Crie seu cadastro</p>
            <div class="formulario">
                <input class="input" type="text" id="nome" placeholder="Nome">
                <input class="input" type="text" id="sobrenome" placeholder="Sobrenome">
                <input class="input" type="text" id="telefone" placeholder="(DDD) Telefone">
                <input class="input" type="text" id="empresa" placeholder="Empresa">
                <input class="input" type="text" id="cargo" placeholder="Cargo">
                <input class="input" type="text" id="email" placeholder="E-mail">
                <input class="input" type="text" id="senha" placeholder="Senha">
            </div>
            <div class="button-cadastrar">
                <button>Cadastrar</button>
            </div>
        </div>

    </div>
</body>
</html>

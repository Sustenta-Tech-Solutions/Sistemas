<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/style_cadastro.css" />
    <link rel="icon" href="imagens/logo_circular_sustentatech.svg" />
    <link rel="stylesheet" href="styles/nav_footer.css" />
  </head>
  <body>
    <div class="header">
      <div class="container">
        <div class="logo">
          <img src="imagens/logo_sustentatech_deitado.svg" />
        </div>
        <ul class="navbar">
          <li class="agora">
            <a href="nav_footer.html">Inicial</a>
          </li>
          <li>
            <a href="sobre.html">Sobre nós</a>
          </li>
          <li>
            <a href="serviços.html">Nossos serviços</a>
          </li>
          <li>
            <a href="Simulador_V2.html">Simulador</a>
          </li>
          <li>
            <a href="contato.html">Contato</a>
          </li>
          <li>
            <a href="login.html">Login</a>
          </li>
          <li>
            <a href="cadastro.html">Cadastrar</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="tela-cadastro">
      <!-- Espaço central entre navbar e footer-->
      <div class="card-cadastro">
        <!-- Card de cadastro -->
        <div class="superior">
          <a href="#" class="voltar">
            <img src="imagens/icone_voltar.svg" width="50" height="50" alt="" />
          </a>
          <img src="imagens/logo_circular_sustentatech.svg" alt="" />
        </div>
        <p>Crie seu cadastro</p>
        <div class="formulario">
          <input class="input" type="text" id="nome" placeholder="Nome" />
          <input
            class="input"
            type="text"
            id="sobrenome"
            placeholder="Sobrenome"
          />
          <input
            class="input"
            type="text"
            id="telefone"
            placeholder="(DDD) Telefone"
          />
          <input class="input" type="text" id="empresa" placeholder="Empresa" />
          <input class="input" type="text" id="cargo" placeholder="Cargo" />
          <input class="input" type="text" id="email" placeholder="E-mail" />
          <input class="input" type="text" id="senha" placeholder="Senha" />
        </div>
        <div class="button-cadastrar">
          <button>Cadastrar</button>
        </div>
      </div>
    </div>
  </body>
</html>
<script>


      // Executa o botão login ao clicar a tecla ENTER
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      login();
    }
  });
</script>

<script>

function cadastrar() {
    var nome = input_nome.value,
        sobrenome = input_sobrenome.value,
        empresa = input_empresa.value,
        email = input_email.value,
        senha = input_senha.value,
        telCelular = input_telCelular.value,
        caract_especiais = [];
    

    // Validação do nome
    if (nome.length <= 1) {
      input_nome.style.border = "1px solid red";

      mensagem_erro.innerHTML = "O nome pode estar vazio!";
      mensagem_erro.style.opacity = "1";

    } else {
      input_nome.style.border = "0.5px solid rgb(94, 106, 113)";

      // Validação do sobrenome
      if (sobrenome.length <= 1) {
        input_sobrenome.style.border = "1px solid red";

        mensagem_erro.innerHTML = "O sobrenome não pode estar vazio!";
        mensagem_erro.style.opacity = "1";

      } else {
        input_sobrenome.style.border = "0.5px solid rgb(94, 106, 113)";

        // Validação da empresa
        if (empresa == "" || empresa.length < 6) {
          input_empresa.style.border = "1px solid red";

          mensagem_erro.innerHTML = "Insira um token válido!";
          mensagem_erro.style.opacity = "1";

        } else {
          input_empresa.style.border = "0.5px solid rgb(94, 106, 113)";

            // Validação do email
            if (email == "" || 
                email.includes(' ') || 
                !email.includes('@') || 
                (!email.endsWith(".com") && !email.endsWith(".br"))) {

              input_email.style.border = "1px solid red";

              mensagem_erro.innerHTML = "Digite um email válido!";
              mensagem_erro.style.opacity = "1";
            } else {
              input_email.style.border = "0.5px solid rgb(94, 106, 113)";

              // Validação da senha
              if (senha.length < 8) {
                input_senha.style.border = "1px solid red";

                mensagem_erro.innerHTML = "A senha precisa ter no minimo 8 caracteres";
                mensagem_erro.style.opacity = "1";
              } else {
                input_senha.style.border = "0.5px solid rgb(94, 106, 113)";

                // Validação do telCelular
                if ((telCelular == "" || telCelular.length < 11)) {
                  input_telCelular.style.border = "1px solid red";

                  mensagem_erro.innerHTML = "Digite um telefone válido!";
                  mensagem_erro.style.opacity = "1";
                } else {
                  input_telCelular.style.border = "0.5px solid rgb(94, 106, 113)";

                  alert('Cadastro Realizado com Sucesso!');
                }
              }
            }
          }
        }
      }
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustenta Tech</title>
    <link rel="stylesheet" href="styles/style_cadastro.css">
    <link rel="stylesheet" href="styles/nav_footer.css">
    <link rel="shortcut icon" href="imagens/logo_circular_sustentatech.svg" type="image/x-icon">
</head>
<body>
    <!-- INICIO ESTRUTURA CABEÇALHO -->
    <div class="header">
      <div class="container">
        <div class="logo">
            <img src="imagens/logo_sustentatech_deitado.svg">
        </div>
        <ul class="navbar">
            <li class="agora"><a href="#">Inicial</a></li>
            <li><a href="#">Sobre nós</a></li>
            <li><a href="#">Nossos serviços</a></li>
            <li><a href="Simulador_V2.html">Simulador</a></li>
            <li><a href="#">Contato</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="cadastro v1.html">Cadastrar</a></li>
        </ul>
      </div>
    </div>
    </div>
    <!-- FIM ESTRUTURA CABEÇALHO -->

    <!-- INICIO ESTRUTURA CENTRAL -->
    <div class="tela-cadastro">
        <div class="card-cadastro">
            <div class="superior">
                <a href="#" class="voltar">
                    <img src="imagens/icone_voltar.svg" width="50"  height="50" alt="">
                </a>
                <img src="imagens/logo_circular_sustentatech.svg" alt="">
            </div>
            <p>Crie seu cadastro</p>
            <div class="formulario">
                <input class="input" type="text" id="input_nome" placeholder="Nome" autocomplete="off">
                <input class="input" type="text" id="input_sobrenome" placeholder="Sobrenome" autocomplete="off">
                <select class="input" id="input_empresa" style="padding: 0px; padding-left: 5px;">
                    <option selected disabled value="">Empresa</option>
                    <option value="1">Atos</option>
                    <option value="2">Bradesco</option>
                    <option value="3">SPTech</option>
                    <option value="4">Safra</option>
                </select>
                <input class="input" type="date" id="input_dtNascimento" placeholder="Data de nascimento" style="color: #838383;" autocomplete="off">
                <input class="input" type="text" id="input_email" placeholder="E-mail" autocomplete="off">
                <input class="input" type="password" id="input_senha" placeholder="Senha" autocomplete="off">
                <input class="input" type="text" id="input_telCelular" placeholder="Telefone Celular" autocomplete="off">
                <input class="input" type="text" id="input_telFixo" placeholder="Telefone Fixo" autocomplete="off">
            </div>
            <div class="button-cadastrar">
                <button onclick="cadastrar()">Cadastrar</button>
            </div>
        </div>
    </div>
    <!-- FIM ESTRUTURA CENTRAL -->

    <!-- INICIO ESTRUTURA RODAPE -->
    <div class="footer">
      <!--<br>-->
      <div class="container">
        <div class="hr1">
          <hr>
        </div>
        <div class="logo">
          <img src="imagens/logo_sustentatech_deitado.svg">
        </div>
        <!--<br>-->
        <div class="hr2">
          <hr>
        </div>
        
      </div>
    </div>
    <!-- FIM ESTRUTURA RODAPE -->
</body>
</html>
<script>

    function cadastrar() {
        var nome = input_nome.value,
            sobrenome = input_sobrenome.value,
            empresa = Number(input_empresa.value),
            dtNascimento = new Date(input_dtNascimento.value + "T00:00:00"),
            email = input_email.value,
            senha = input_senha.value,
            telCelular = input_telCelular.value,
            telFixo = input_telFixo.value;
          
        var dtAtual = new Date();

        if (nome.length <= 1) {
          alert(`O nome não pode estar vazio ou ter 1 caractere!`);
          return
        } else if (sobrenome.length <= 1) {
          alert(`O sobrenome não pode estar vazio ou ter 1 caractere!`);
          return
        } else if (!empresa) {
          alert(`Selecione uma empresa válida!`);
          return;
        } else if (!dtNascimento || dtNascimento >= dtAtual) {
          alert("Informe uma data de nascimento válida!");
          return;
        } else if (email == "" || !email.includes("@") || !email.includes(".com")) {
          alert("Insira um e-mail válido!");
          return;
        } else if (senha.length < 6) {
          alert("A senha deve ter pelo menos 6 caracteres!");
          return;
        } else if (telCelular == "" || telCelular.length < 11) {
          alert("Telefone celular inválido!");
          return;
        } else if (telFixo !== "" && telFixo.length < 10) {
          alert("Telefone fixo inválido!");
          return;
        }
        alert("Cadastro realizado com sucesso!")
    }
</script>

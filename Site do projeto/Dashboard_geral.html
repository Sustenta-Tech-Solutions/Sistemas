<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/dash_geral.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="imagens/logo_sustentatech_deitado.svg" />
      </div>
      <div class="user">Olá User</div>
    </header>

    <div class="container">
      <nav class="sidebar">
        <a href="Dashboard_geral.html" class="button">Dashboard Geral</a>
        <a href="Dashboard_espec.html" class="button">Dashboard específica</a>
        <a href="configuracao.html" class="button">Configurações</a>
        <button class="logout" onclick="logout()">Sair</button>
      </nav>

      <main>
        <div class="card-grid top">
          <div class="kpi">Temperatura média
            <div id="div_temp"></div>
          </div>
          <div class="kpi">Umidade média
            <div id="div_umid"></div>
          </div>
          <div class="kpi">Quantidade de alertas
            <div id="div_alertas"></div>
          </div>
        </div>

        <div class="card-grid mid">
          <div class="graphics">
            <canvas class="g1" id="chartTemp"></canvas>
          </div>
          <div class="graphics">
            <canvas class="g2" id="chartUmid"></canvas>
          </div>
        </div>

        <div class="alerts">
          <div class="alerts-header">
            <h3>Últimos Alertas</h3>
          </div>

          <!-- table - estrutura de tabela , thead - titulo das colunas , tr - linhas da tabela, 
           th - cabeçalho da tabela, tbody - corpo da tabela -->
           
          <table class="alerts-table">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Horário</th>
                <th>Duração</th>
                <th>Sensor</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <div class="alert-info">
                    <div class="alert-icon temp"></div>
                    <div>
                      <strong>Temperatura alta</strong><br />
                      <span>Silo 03</span>
                    </div>
                  </div>
                </td>
                <td>14/10/2025 - 14:32</td>
                <td>15 min</td>
                <td>Sensor 1 Topo</td>
              </tr>
              <tr>
                <td>
                  <div class="alert-info">
                    <div class="alert-icon hum"></div>
                    <div>
                      <strong>Umidade baixa</strong><br />
                      <span>Silo 01</span>
                    </div>
                  </div>
                </td>
                <td>14/10/2025 - 13:20</td>
                <td>8 min</td>
                <td>Sensor 2 Central</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
<script>



  // Graficos
  const ctxTemp = document.getElementById("chartTemp");
  const ctxUmid = document.getElementById("chartUmid");

  new Chart(ctxTemp, {
    type: "line",
    data: {
      labels: [
        "8:00:00 AM", "8:15:00 AM", "8:30:00 AM", "8:45:00 AM",
        "9:00:00 AM", "9:15:00 AM", "9:30:00 AM",
      ],
      datasets: [
        {
          label: "Silo A",
          data: [11.5, 11.3, 11.1, 11.0, 11.8, 13.5, 13],
          borderColor: "#005a9e",
          backgroundColor: "#005a9e",
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.3,
          fill: false,
        },
        {
          label: "Silo B",
          data: [31, 33, 32, 34, 36, 40, 38],
          borderColor: "#f76b1c",
          backgroundColor: "#f76b1c",
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.3,
          fill: false,
        },
        {
          label: "Silo C",
          data: [25, 24, 23, 25, 26, 25, 24],
          borderColor: "#2e8b57",
          backgroundColor: "#2e8b57",
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.3,
          fill: false,
        },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          display: true,
          position: "bottom",
          labels: {
            font: {
              size: 14,
            },
          },
        },
        title: {
          display: true,
          text: "Temperatura média por silo",
          font: {
            size: 18,
          },
        },
      },
      scales: {
        x: {
          ticks: {
            maxRotation: 45,
            minRotation: 45,
          },
          grid: {
            display: false,
          },
        },
        y: {
          beginAtZero: false,
          suggestedMin: 0,
          suggestedMax: 45,
          grid: {
            color: "#0074D9",
            lineWidth: 1,
          },
          ticks: {
            stepSize: 5,
          },
        },
      },
    },
  });

  new Chart(ctxUmid, {
    type: "line",
    data: {
      labels: [
        "8:00:00 AM", "8:15:00 AM", "8:30:00 AM", "8:45:00 AM",
        "9:00:00 AM", "9:15:00 AM", "9:30:00 AM",
      ],
      datasets: [
        {
          label: "Silo A",
          data: [60, 64, 69 , 67, 71, 75, 66],
          borderColor: "#005a9e",
          backgroundColor: "#005a9e",
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.3,
          fill: false,
        },
        {
          label: "Silo B",
          data: [59, 63, 65, 68, 73, 75 , 78],
          borderColor: "#f76b1c",
          backgroundColor: "#f76b1c",
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.3,
          fill: false,
        },
        {
          label: "Silo C",
          data: [57, 63, 65, 66, 59, 67, 70],
          borderColor: "#2e8b57",
          backgroundColor: "#2e8b57",
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.3,
          fill: false,
        },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          display: true,
          position: "bottom",
          labels: {
            font: {
              size: 14,
            },
          },
        },
        title: {
          display: true,
          text: "Umidade média por silo",
          font: {
            size: 18,
          },
        },
      },
      scales: {
        x: {
          ticks: {
            maxRotation: 45,
            minRotation: 45,
          },
          grid: {
            display: false,
          },
        },
        y: {
          beginAtZero: false,
          suggestedMin: 50,
          suggestedMax: 90,
          grid: {
            color: "#0074D9",
            lineWidth: 1,
          },
          ticks: {
            stepSize: 5,
          },
        },
      },
    },
  });
</script>

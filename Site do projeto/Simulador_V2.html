<script>
    function simular() {
        var silo = Number(ipt_silo.value); 
        var capacidade = Number(ipt_capacidade.value); 
        var mes = Number(select_mes.value);
        var capacidadeTotal = capacidade * silo;

        if (silo == "") {
            div_mensagem.innerHTML = "A quantidade de silos não pode estar vazia.";
            ipt_silo.focus();
        } else if (capacidade == "") {
            div_mensagem.innerHTML = "A capacidade máxima não pode estar vazia.";
            ipt_capacidade,focus();
        } else if (mes == "#") {
            div_mensagem.innerHTML = "Selecione um mês.";
            select_mes.focus();
        } else { // Cálculos principais
            var sacaTotal = Math.floor(capacidadeTotal / 0.06); // Quantidade total de sacas que os silos podem armazenar
            var receita = mes * sacaTotal // Valor total da venda de todas as sacas pelo preço unitário do mês escolhido
            var prejuizo = receita * 0.02 // Valor do prejuizo de 2% da venda total causado pela condensação

            // Mensagem ao usuário
            div_mensagem.innerHTML = `
            <b>Quantidade de silos:</b> ${silo}<br>
            <b>Capacidade total armazenada:</b> ${capacidadeTotal.toLocaleString()} toneladas<br>
            <b>Total estimado em sacas de soja:</b> ${sacaTotal.toLocaleString()} (60 kg cada)<br>
            <b>Preço médio da saca:</b> ${mes.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}<br>
            <p>Devido o problema da condensação dentro dos silos, podem surgir pragas, fungos e insetos, 
            que geram uma perda estimada de 2% do armazenamento.<br>
            <b>Prejuízo estimado:</b> R$ ${prejuizo.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}<br>
            <p>Com o nosso sistema de controle de temperatura e umidade, 
            é possível evitar esse prejuízo.<br>
            `;
        }
    }
</script>

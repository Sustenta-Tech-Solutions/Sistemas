<script>
  function login() {
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;

    if (emailVar == "" || senhaVar == "") {
      erroLogin.style.display = "block";
      ipt_email.style.borderColor = "red";
      ipt_senha.style.borderColor = "red";
    } else {

      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          emailServer: emailVar,
          senhaServer: senhaVar
        })
      }).then(function (resposta) {
        console.log("ESTOU NO THEN DO entrar()!")

        if (resposta.ok) {
          console.log(resposta);

          resposta.json().then(json => {
            console.log(json);
            console.log(JSON.stringify(json));
            sessionStorage.EMAIL = json.email;
            sessionStorage.NOME = json.nome;
            sessionStorage.EMPRESA = json.fkEmpresa;
            sessionStorage.ID_EMPRESA = json.id;
            sessionStorage.NUM_SILOS = json.silos;
            var empresa = json.fkEmpresa;


            // alert("Usuário logado com sucesso!");
            erroLogin.style.display = "none";
            ipt_email.style.borderColor = "black";
            ipt_senha.style.borderColor = "black";
            
            

            if (empresa != 'SustentaTech') {
              setTimeout(function () {
                alert('Login realizado com sucesso!')
                window.location = "/Dashboard_geral.html";
              }, 1000)

            } else {
              alert('Login realizado com sucesso!')
              setTimeout(function () {
                window.location = "/telaAdm.html";
              }, 1000)


            }

          }).catch(function (erro) {
            console.log(erro);
          });

        } else {

          console.log("Houve um erro ao tentar realizar o login!");

          resposta.text().then(texto => {
            console.error(texto);
            erroLogin.style.display = "block";
            ipt_email.style.borderColor = "red";
            ipt_senha.style.borderColor = "red";
          });

        }
      })
    }
  }
</script>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard_geral</title>
  <link rel="stylesheet" href="styles/dash_geral.css" />
  <link rel="icon" href="imagens/logo_circular_sustentatech.svg" />
</head>

<body onload="adquirirDadosSilos()">


  <div class="container">
    <nav class="sidebar">

      <div class="div-user">Olá, User</div>

      <div class="div-buttons">

        <a href="Dashboard_geral.html" class="button">Dashboard Geral</a>
        <a href="Dashboard_espec.html" class="button">Dashboard específica</a>
        <button class="button" onclick="entrarEmContato()">Entre em contato!</button>
        <button class="logout" onclick="logout()">Sair</button>

      </div>

      <div class="div-logo">
        <img src="imagens/logo_sustentatech_deitado.svg" />
      </div>
    </nav>

    <main>

      <div id="div_metricas">

        <div class="metricas">

          <h5>MÉTRICAS</h5>
          
          <div class="metricaTemperatura">

            <span>Temperatura <img src="imagens/termometro-removebg-preview.png" alt=""></span>

            <div class="intervalos">
              <p style="color:green">Ideal: 14° a 24°</p>
              <p style="color:lab(69.48% 36.83 75.49)">Atenção: 10° a 13° ou 25° a 27° </p>
              <p style="color:rgb(252, 0, 0)">Alerta: -10°C ou +28°C</p>
            </div>
          </div>

          <div class="metricaUmidade">

            <span>Umidade <img style="width: 30px" src="imagens/umidade-removebg-preview.png"
                alt="imagem de umidade"></span>
            <div class="intervalos">
              <p style="color:green">Ideal: 60% a 70%</p>
              <p style="color:lab(69.48% 36.83 75.49)">Atenção: 55% a 59% ou 71% a 74% </p>
              <p style="color:rgb(252, 0, 0)">Alerta: 0% a 50% ou 75%+</p>
            </div>

          </div>

        </div>

        <div>
          <div class="alert-count-box">
            <h3>Quantidade de alertas</h3>
            <div class="alert-number" id="numAlertas">6</div>
          </div>
        </div>
      </div>

      <div id="silosContainer" class="silos-grid"></div>

      <div class="alerts">
        <div class="alerts-header">
          <h3>Últimos Alertas</h3>
        </div>

        <!-- table - estrutura de tabela , thead - titulo das colunas , tr - linhas da tabela, 
           th - cabeçalho da tabela, tbody - corpo da tabela -->

        <table class="alerts-table">
          <thead>
            <tr>
              <th>Tipo</th>
              <th>Data e Hora</th>
              <th>Medição</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="alertasTableBody">
            <tr>
              <td>
                <div class="alert-info">
                  <div class="alert-icon temp"></div>
                  <div>
                    <strong></strong><br />
                    <span></span>
                  </div>
                </div>
              </td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td>
                <div class="alert-info">
                  <div class="alert-icon hum"></div>
                  <div>
                    <strong></strong><br />
                    <span></span>
                  </div>
                </div>
              </td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>

</html>
<script>
  var silos = [
    [],
    [],
    []
  ];

  var alertas = [];

  function adquirirDadosSilos() {
    var idEmpresa = sessionStorage.ID_EMPRESA;
    var qtdSilos = sessionStorage.NUM_SILOS;

    fetch(`/medidas/ultimas/${idEmpresa}&${qtdSilos}`, { cache: 'no-store' })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

            if (silos[0].length > 0) {
              silos.forEach(arr => arr.length = 0);
              alertas.length = 0;
            }

            for (let i = 0; i < resposta.length; i++) {
              silos[0].push(`${i + 1}`)
              silos[1].push(Number(parseFloat(resposta[i].temperaturaMedia).toFixed(2)));
              silos[2].push(Number(parseFloat(resposta[i].umidadeMedia).toFixed(2))
              );

            }
            carregarSilos();
            carregarAlertas();


          });
        } else {
          console.error('Nenhum dado encontrado ou erro na API');
        }
      })
      .catch(function (error) {
        console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
      });


    setTimeout(function () {
      adquirirDadosSilos()
    }, 600000)
  }



  function getStatus(silo, temp, umid) {
    // Status Temp
    if (temp >= 28) {
      alertas.push({
        tipo: "Temperatura alta",
        valor: `${temp}°C`,
        silo: `${silo}`,
        data: new Date()
      });
      return "alert";
    } else if (temp <= 10) {
      alertas.push({
        tipo: "Temperatura baixa",
        valor: `${temp}°C`,
        silo: `${silo}`,
        data: new Date()
      });
      return "alert";
    }


    // Status Umid
    if (umid <= 55) {
      alertas.push({
        tipo: "Umidade Baixa",
        valor: `${umid}%`,
        silo: `${silo}`,
        data: new Date()
      });
      return "alert";
    } else if (umid >= 75) {
      alertas.push({
        tipo: "Umidade alta",
        valor: `${umid}%`,
        silo: `${silo}`,
        data: new Date()
      });
      return "alert";
    }

    // Status geral
    if ((temp >= 25 && temp < 28) || (umid >= 71 && umid < 75)) {
      alertas.push({
        tipo: temp >= 25 ? "Temperatura em atenção" : "Umidade em atenção",
        silo,
        valor: temp >= 25 ? `${temp}°C` : `${umid}%`,
        data: new Date()
      });
      return "attention";
    }

    return "ok";

  }

  function carregarSilos() {
    const container = document.getElementById("silosContainer");
    container.innerHTML = "";
    for (let i = 0; i < silos[0].length; i++) {

      let silo = silos[0][i];
      var temp = silos[1][i];
      var umid = silos[2][i];
      let status = getStatus(silo, temp, umid);

      const card = document.createElement("div");
      card.classList.add("silo-card");

      const icon = document.createElement("div");
      icon.classList.add("silo-icon", status);

      const name = document.createElement("div");
      name.classList.add("silo-name");
      name.textContent = "Silo " + silo;

      card.appendChild(icon);
      card.appendChild(name);

      card.onclick = function () {
        window.location = `/Dashboard_espec.html?siloId=${silo}`
      };

      container.appendChild(card);
    }
  }

  function carregarAlertas() {
    const tbody = document.getElementById("alertasTableBody");
    tbody.innerHTML = ""; // limpa antes de montar

    let numAlertas = 0;
    alertas.slice(-10).reverse().forEach(alerta => {
      const tr = document.createElement("tr");
      numAlertas++;

      tr.innerHTML = `
      <td>
        <div class="alert-info">
          <div class="alert-icon ${alerta.tipo.includes("Temperatura") ? "temp" : "hum"}"></div>
          <div>
            <strong>${alerta.tipo}</strong><br />
            <span>Silo ${alerta.silo}</span>
          </div>
        </div>
      </td>
      <td>${formatarData(alerta.data)}</td>
      <td>${alerta.valor}</td>
    `;

      tbody.appendChild(tr);
    });

    document.getElementById("numAlertas").textContent = numAlertas;
  }

  function formatarData(data) {
    return data.toLocaleDateString("pt-BR") + " - " +
      data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function entrarEmContato() {
    window.location();
  }


  function logout() {
    sessionStorage.clear();
    window.location.href = "login.html";
  }

  console.log(alertas)
</script>

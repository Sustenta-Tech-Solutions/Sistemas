<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="styles/telaAdm.css">
</head>

<body onload="nome()">

    <header>
        <div class="logo">
            <img src="imagens/logo_sustentatech_deitado.svg" />
        </div>
        <div class="div-user"><span>Olá, </span> <span id="userName"></span></div>
    </header>

    <div class="main">
        <nav class="sidebar">
            <!-- <a href="Dashboard_geral.html" class="button">Dashboard Geral</a>
            <a href="Dashboard_espec.html" class="button">Dashboard específica</a> -->
            <a href="#" class="button">JIRA</a>
            <button class="logout" onclick="logout()">Sair</button>
        </nav>

        <div id="container_bobia" class="container_bobia">
            <div class="forms_bobia">
                <h1>BobIA</h1>
                <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
                <br><br>
                <button onclick="gerarResposta()" class="bobIa_button">Gerar Resposta</button>
                <h3>Resposta da IA:</h3>
                <div id="resposta"></div>
            </div>
        </div>
    </div>

    <script>

        function nome(){
            var nomeUsuario = sessionStorage.NOME;
        document.getElementById("userName").textContent = nomeUsuario
        }

        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;

            const response = await fetch('/perguntar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ pergunta })
            });

            const data = await response.json();

            resposta.style.display = 'block';
            document.getElementById('resposta').innerText = data.resultado;
        }

    </script>

</body>

</html>

<script>
    function logout() {
    sessionStorage.clear();
    window.location.href = "login.html";
  }

</script>
